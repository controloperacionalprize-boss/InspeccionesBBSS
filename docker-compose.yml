services:
  # Solo si DATABASE_URL usa host postgres (compose). Con Neon se puede omitir.
  postgres:
    image: postgres:16-alpine
    container_name: consultar_campo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en un .env en la raíz (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en un .env en la raíz (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-consultar_campo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: consultar_campo_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: consultar_campo_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
